name: Build Resume

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pandoc/extra:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build HTML
        run: |
          mkdir -p _site
          pandoc index.md \
            -o _site/index.html \
            --standalone \
            --metadata title="Josh Day - Resume" \
            --css=style.css \
            --embed-resources

      - name: Build PDF
        run: |
          pandoc index.md \
            -o _site/resume.pdf \
            --pdf-engine=pdflatex \
            -V geometry:margin=0.75in \
            -V fontsize=11pt \
            -V colorlinks=true \
            -V linkcolor=blue \
            -V urlcolor=blue

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: |
            _site/index.html
            _site/resume.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
